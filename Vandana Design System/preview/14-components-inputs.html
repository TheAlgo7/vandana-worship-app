<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 22px 24px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: #C4AA7E; margin-bottom: 14px; }
  .search { position: relative; margin-bottom: 12px; }
  .search input { width: 100%; height: 48px; padding: 0 16px 0 44px; background:#141418; color:#ECEAE4; font-size:13px; border:1px solid #242330; border-radius:999px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.4); outline:none; font-family: var(--font-body); }
  .search .ic { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:#44424F; }
  .toggle-row { display:flex; gap:10px; }
  .tg { flex:1; padding:10px 0; text-align:center; border:1px solid #242330; border-radius:12px; font-size:12px; color:#87849A; background: transparent; cursor:pointer; font-family:var(--font-body);}
  .tg.active { background: rgba(196,170,126,0.10); color:#C4AA7E; border-color:#C4AA7E; font-weight:600; }
</style></head>
<body><div class="card">
  <div class="label">Inputs</div>
  <div class="search">
    <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
    <input placeholder="Search songs, artists…">
  </div>
  <div class="toggle-row">
    <button class="tg active">Hinglish</button>
    <button class="tg">हिंदी (Hindi)</button>
  </div>
</div></body></html>
