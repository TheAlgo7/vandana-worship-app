<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 22px 24px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: #C4AA7E; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { padding: 8px 18px; font-size: 13px; font-weight: 600; border-radius: 999px; cursor: pointer; border: 1px solid transparent; transition: all 200ms ease; font-family: var(--font-body); }
  .btn.primary { background: #C4AA7E; color: #0A0A0E; }
  .btn.primary:hover { background: #D4BC94; }
  .btn.secondary { background: transparent; border-color: #242330; color: #87849A; }
  .btn.secondary:hover { border-color: #C4AA7E; color: #ECEAE4; }
  .btn.active { background: #C4AA7E; color: #0A0A0E; box-shadow: 0 2px 8px rgba(196,170,126,0.25); }
  .n { font-family: ui-monospace, monospace; font-size:10px; color:#87849A; margin-left: 6px; }
</style></head>
<body><div class="card">
  <div class="label">Buttons</div>
  <div class="row">
    <button class="btn primary">Present</button>
    <button class="btn secondary">YouTube</button>
    <button class="btn active">All</button>
    <button class="btn secondary">ICM</button>
    <button class="btn secondary">FOLJ Church</button>
  </div>
  <p class="n" style="margin-top:12px">pill · 8/18 · 13px/600 · 200ms ease · :active scale(0.97)</p>
</div></body></html>
