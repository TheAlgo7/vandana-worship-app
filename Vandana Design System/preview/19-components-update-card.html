<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 16px 20px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: #C4AA7E; margin-bottom: 12px; }
  .uc { background:#141418; border-radius: 16px; padding: 16px; margin-bottom: 10px; }
  .tr { display:flex; justify-content: space-between; align-items: flex-start; gap: 12px;}
  .t { font-size: 16px; font-weight: 600; color:#ECEAE4;}
  .d { font-size: 12px; color:#44424F; white-space: nowrap; }
  .b { font-size: 13px; color:#87849A; line-height:1.6; margin-top: 8px; }
  .pl { display:inline-block; background: rgba(196,170,126,0.10); color: #C4AA7E; font-size: 12px; border-radius: 999px; padding: 2px 12px; margin-top:8px; font-weight:500; }
</style></head>
<body><div class="card">
  <div class="label">Update Card — bell feed</div>
  <div class="uc">
    <div class="tr"><span class="t">4 new songs added</span><span class="d">14 Apr</span></div>
    <p class="b">Fresh from FOLJ Church's latest album — now available in both Hinglish and Hindi.</p>
    <span class="pl">4 songs</span>
  </div>
</div></body></html>
