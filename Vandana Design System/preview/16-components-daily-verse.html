<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 22px 24px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: #C4AA7E; margin-bottom: 14px; }
  .verse { padding-left:16px; border-left: 2px solid rgba(196,170,126,0.4); }
  .vl { font-size: 11px; font-weight: 600; letter-spacing: 0.18em; color: #C4AA7E; opacity: 0.6; text-transform: uppercase; margin-bottom: 10px; }
  .vt { font-family: var(--font-display); font-style: italic; font-size: 18px; line-height: 1.6; color:#ECEAE4; margin: 0; }
  .vr { font-size: 13px; color:#44424F; margin-top: 8px; }
</style></head>
<body><div class="card">
  <div class="label">Daily Verse — gold-bordered blockquote</div>
  <p class="vl">Verse of the Day</p>
  <blockquote class="verse">
    <p class="vt">&ldquo;The Lord is my shepherd; I shall not want. He maketh me to lie down in green pastures.&rdquo;</p>
    <p class="vr">— Psalm 23:1–2</p>
  </blockquote>
</div></body></html>
