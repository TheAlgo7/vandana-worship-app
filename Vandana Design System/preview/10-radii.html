<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 22px 24px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .box { background:#141418; border-radius: var(--radius-md); }
  .n { font-family: ui-monospace, monospace; font-size:10px; color:#87849A; }
</style></head>
<body><div class="card">
  <div class="label">Radii</div>
  <div class="row"><div class="box" style="width:56px; height:40px; border-radius:8px"></div><span style="font-size:12px">sm</span><span class="n">8px</span></div>
  <div class="row"><div class="box" style="width:56px; height:40px; border-radius:12px"></div><span style="font-size:12px">md</span><span class="n">12px — default card</span></div>
  <div class="row"><div class="box" style="width:56px; height:40px; border-radius:16px"></div><span style="font-size:12px">lg</span><span class="n">16px — neumorphic panel</span></div>
  <div class="row"><div class="box" style="width:100px; height:30px; border-radius:999px"></div><span style="font-size:12px">pill</span><span class="n">999px — buttons, chips, inputs</span></div>
</div></body></html>
