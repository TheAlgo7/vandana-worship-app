<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; }
  .card { padding: 20px 24px; font-family: var(--font-body); color: var(--text-primary); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: 10px; padding: 12px; min-height: 92px; display:flex; flex-direction: column; justify-content: space-between; }
  .name { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
  .hex { font-family: ui-monospace, monospace; font-size: 10px; opacity: 0.75; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 10px; }
  .tag { font-size: 10px; opacity: .7; }
</style></head>
<body><div class="card">
  <div class="label">Accent — Candlelight Gold</div>
  <div class="row">
    <div class="sw" style="background:#C4AA7E; color:#0A0A0E"><div class="tag">DARK</div><div><div class="name">accent</div><div class="hex">#C4AA7E</div></div></div>
    <div class="sw" style="background:rgba(196,170,126,0.10); color:#C4AA7E; border:1px solid #242330"><div class="tag">DARK</div><div><div class="name">accent-dim</div><div class="hex">rgba(196,170,126,.10)</div></div></div>
    <div class="sw" style="background:#7A6340; color:#F4F0E8"><div class="tag">LIGHT</div><div><div class="name">accent</div><div class="hex">#7A6340</div></div></div>
    <div class="sw" style="background:#D4BC94; color:#0A0A0E"><div class="tag">DARK</div><div><div class="name">accent-hover</div><div class="hex">#D4BC94</div></div></div>
  </div>
</div></body></html>
