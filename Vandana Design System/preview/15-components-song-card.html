<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 10px 20px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: #C4AA7E; margin: 12px 0 6px; }
  .row { display: flex; align-items: center; min-height: 76px; padding: 14px 0; border-bottom: 1px solid #1C1B26; }
  .pill { width: 3px; height: 28px; border-radius: 2px; background: #C4AA7E; opacity: 0.45; margin-right: 14px; flex-shrink: 0; }
  .left { flex: 1; min-width: 0; }
  .title { font-family: var(--font-display); font-size: 17px; font-weight: 600; color:#ECEAE4; line-height:1.3; display:flex; align-items:center; gap:6px;}
  .art { font-size: 13px; color:#87849A; margin-top: 2px; }
  .meta { font-size: 11px; color:#44424F; margin-left: 12px;}
  .chev { color:#44424F; margin-left: 8px; }
  .heart { width:10px; height:10px; color:#C4AA7E; opacity:0.5; fill:#C4AA7E;}
</style></head>
<body><div class="card">
  <div class="label">Song Card — list row</div>
  <a class="row" style="text-decoration:none">
    <div class="pill"></div>
    <div class="left">
      <div class="title">Vandana <svg class="heart" viewBox="0 0 24 24"><path d="M19 14c1.5-1.5 3-3.3 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.7 0-3 .5-4.5 2-1.5-1.5-2.8-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.2 1.5 4 3 5.5l7 7Z"/></svg></div>
      <div class="art">Ankit Sajwan Ministries</div>
    </div>
    <span class="meta">FOLJ Church</span>
    <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
  </a>
  <a class="row" style="text-decoration:none">
    <div class="pill"></div>
    <div class="left">
      <div class="title">Chamka Sitara</div>
      <div class="art">Br. Ankur Masih &amp; Ps. Bharat</div>
    </div>
    <span class="meta">ICM</span>
    <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
  </a>
</div></body></html>
