<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--accent); }
  .row { display: flex; gap: 16px; align-items: center; }
  .box { width: 80px; height: 44px; background: #141418; border-radius: var(--radius-md); }
  .outer { box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
  .sm { box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .press { box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), inset 0 -1px 2px rgba(255,255,255,0.03); }
  .panel { box-shadow: 0 2px 8px rgba(0,0,0,0.2), 0 1px 0 rgba(255,255,255,0.04) inset; }
  .glow { box-shadow: 0 2px 8px rgba(196,170,126,0.25); background: #C4AA7E; }
  .n { font-family: ui-monospace, monospace; font-size:10px; color:#87849A; }
  .t { font-size: 12px; color:#ECEAE4; }
</style></head>
<body><div class="card">
  <div class="label">Shadow System</div>
  <div class="row"><div class="box outer"></div><span class="t">shadow</span><span class="n">floating — toast</span></div>
  <div class="row"><div class="box sm"></div><span class="t">shadow-sm</span><span class="n">subtle lift</span></div>
  <div class="row"><div class="box press"></div><span class="t">inset press</span><span class="n">card :active</span></div>
  <div class="row"><div class="box panel"></div><span class="t">neumorphic panel</span><span class="n">controls toolbar</span></div>
  <div class="row"><div class="box glow"></div><span class="t">accent glow</span><span class="n">active pill</span></div>
</div></body></html>
