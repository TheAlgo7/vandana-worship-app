<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 22px 24px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 14px; }
  .scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 18px; }
  .step { display: flex; flex-direction: column; align-items: flex-start; }
  .step .n { font-family: ui-monospace, monospace; font-size: 10px; color: #87849A; }
</style></head>
<body><div class="card">
  <div class="label">Type Scale — 8 steps</div>
  <div class="scale">
    <div class="step"><span style="font-size:11px">Aa</span><span class="n">xs · 11</span></div>
    <div class="step"><span style="font-size:13px">Aa</span><span class="n">sm · 13</span></div>
    <div class="step"><span style="font-size:15px">Aa</span><span class="n">base · 15</span></div>
    <div class="step"><span style="font-size:18px">Aa</span><span class="n">lg · 18</span></div>
    <div class="step"><span style="font-size:22px">Aa</span><span class="n">xl · 22</span></div>
    <div class="step"><span style="font-size:28px">Aa</span><span class="n">2xl · 28</span></div>
    <div class="step"><span style="font-size:36px">Aa</span><span class="n">3xl · 36</span></div>
    <div class="step"><span style="font-size:48px; font-family:var(--font-display); font-weight:700; letter-spacing:-0.03em;">Aa</span><span class="n">4xl · 48</span></div>
  </div>
</div></body></html>
