<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 22px 24px; display: flex; align-items: center; gap: 36px; flex-wrap: wrap; min-height: 150px; box-sizing: border-box; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: #C4AA7E; width: 100%; margin-bottom: 4px; }
  .wordmark { font-family: var(--font-brand); font-size: 52px; color: #C4AA7E; line-height: 1; }
  .deva { font-family: 'Noto Sans Devanagari', serif; font-size: 42px; color: #C4AA7E; line-height: 1; font-weight: 500; }
  .line { width: 40px; height: 1px; background: #C4AA7E; opacity: 0.4; margin-top: 10px; }
  .stack { display:flex; flex-direction: column; align-items: flex-start; }
  .tag { font-size: 11px; color: #87849A; margin-top: 8px; letter-spacing: 0.04em; }
</style></head>
<body><div class="card">
  <div class="label">Brand Wordmark</div>
  <div class="stack">
    <span class="wordmark">Vandana</span>
    <div class="line"></div>
    <span class="tag">Latin · Cathez</span>
  </div>
  <div class="stack">
    <span class="deva">वंदना</span>
    <div class="line"></div>
    <span class="tag">Devanagari · Noto Sans</span>
  </div>
</div></body></html>
