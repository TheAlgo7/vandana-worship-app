<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 22px 24px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: #C4AA7E; margin-bottom: 14px; }
  .tog { display: inline-flex; border-radius: 999px; border: 1px solid #242330; overflow: hidden; margin-right: 14px; }
  .tog button { padding: 6px 14px; font-size: 11px; font-weight: 400; background:transparent; color:#44424F; border:none; cursor:pointer; font-family:var(--font-body); }
  .tog button.on { background:#C4AA7E; color:#0A0A0E; font-weight:600; box-shadow: 0 2px 8px rgba(196,170,126,0.25); }
  .fs { display:inline-flex; gap: 8px; vertical-align: middle; }
  .fs button { width:30px; height:30px; border-radius:999px; border:1px solid #242330; background:transparent; color:#ECEAE4; font-weight:600; font-size:11px; cursor:pointer;}
  .fs button.on { background:#C4AA7E; color:#0A0A0E; border-color:#C4AA7E;}
  .panel { background:#141418; border-radius: 16px; padding: 10px 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.2), 0 1px 0 rgba(255,255,255,0.04) inset; display:flex; align-items:center;  gap: 4px; }
</style></head>
<body><div class="card">
  <div class="label">Controls Toolbar — Lyrics page · neumorphic panel</div>
  <div class="panel">
    <div class="tog"><button class="on">Hinglish</button><button>Hindi</button></div>
    <div class="fs"><button>A−</button><button class="on">Aa</button><button>A+</button></div>
  </div>
</div></body></html>
