<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 22px 24px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 14px; }
  .row { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
  .name { font-size: 10px; color: #87849A; font-family: ui-monospace, monospace; }
</style></head>
<body><div class="card">
  <div class="label">Body Type — Plus Jakarta Sans</div>
  <div class="row"><span style="font-size:18px; font-weight:500;">Worship in your language.</span><span class="name">18 · text-lg</span></div>
  <div class="row"><span style="font-size:15px;">No ads, no clutter, no missing songs.</span><span class="name">15 · text-base</span></div>
  <div class="row"><span style="font-size:13px; color:#87849A;">ICM · Br. Ankur Masih &amp; Ps. Bharat</span><span class="name">13 · text-sm</span></div>
  <div class="row"><span style="font-size:11px; color:#44424F; text-transform:uppercase; letter-spacing:0.18em;">CHORUS</span><span class="name">11 · text-xs</span></div>
</div></body></html>
