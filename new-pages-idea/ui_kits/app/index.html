<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vandana — UI Kit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #0A0908; min-height: 100vh; }
  body {
    font-family: var(--font-body);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    padding: 48px 24px 80px;
    box-sizing: border-box;
  }
  .lede {
    max-width: 680px; text-align: center;
  }
  .lede h1 {
    font-family: var(--font-display);
    font-size: 34px; font-weight: 700;
    color: var(--text-primary); margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .lede h1 .dev {
    font-family: var(--font-devanagari);
    color: var(--accent); opacity: 0.7; font-weight: 500;
    margin-left: 12px; font-size: 26px;
  }
  .lede p {
    color: var(--text-secondary); font-size: 15px;
    line-height: 1.6; margin: 0;
  }

  .phones {
    display: flex; gap: 48px; flex-wrap: wrap;
    justify-content: center; align-items: flex-start;
  }
  .phone-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .phone-label {
    font-size: 11px; font-weight: 700;
    letter-spacing: var(--tracking-widest);
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* Custom phone frame — dark-first, minimal */
  .phone {
    position: relative;
    width: 390px; height: 790px;
    border-radius: 48px;
    background: #000;
    padding: 8px;
    box-shadow:
      0 40px 100px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.04),
      inset 0 0 0 1.5px rgba(255,255,255,0.06);
  }
  .phone-screen {
    position: absolute;
    inset: 8px;
    border-radius: 40px;
    overflow: hidden;
    background: var(--bg-base);
  }
  .notch {
    position: absolute; top: 16px; left: 50%;
    transform: translateX(-50%);
    width: 112px; height: 30px; border-radius: 20px;
    background: #000; z-index: 100;
  }
  .home-indicator {
    position: absolute; bottom: 6px; left: 50%;
    transform: translateX(-50%);
    width: 126px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.3);
    z-index: 100;
  }

  /* Status bar */
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 56px; z-index: 90;
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 28px 8px;
    font-size: 15px; font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.01em;
    box-sizing: border-box;
  }
  .status-time { font-variant-numeric: tabular-nums; }
  .status-right { display: flex; gap: 6px; align-items: center; }

  /* Lift content below status bar */
  .phone-content {
    position: absolute; top: 56px; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
  }

  /* Hint card */
  .hint {
    max-width: 520px; padding: 16px 20px;
    background: rgba(211,180,106,0.06);
    border: 1px solid rgba(211,180,106,0.2);
    border-radius: 12px;
    font-size: 13px; color: var(--text-secondary);
    line-height: 1.55; text-align: center;
  }
  .hint b { color: var(--accent); font-weight: 600; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translate(-50%, 6px) scale(0.96); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
</style>
</head>
<body>

<section class="lede">
  <h1>Vandana <span class="dev">वंदना</span></h1>
  <p>Bilingual Hindi · Hinglish worship lyrics. A dark-first, reverent PWA for worship leaders and congregations.</p>
</section>

<div class="hint">
  Tap a song to open it. Long-press to favourite. Try <b>Present</b> for full-screen block-by-block lyrics.
</div>

<div class="phones">
  <div class="phone-wrap">
    <div class="phone">
      <div class="notch"></div>
      <div class="phone-screen">
        <div class="status-bar">
          <span class="status-time">9:41</span>
          <span class="status-right">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.7" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="0.7" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="0.7" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="0.7" fill="currentColor"/></svg>
            <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3" stroke="currentColor" stroke-opacity="0.4"/><rect x="2" y="2" width="19" height="9" rx="2" fill="currentColor"/><path d="M24 4v5c.7-.3 1.2-1 1.2-2.5S24.7 4.3 24 4Z" fill="currentColor" fill-opacity="0.5"/></svg>
          </span>
        </div>
        <div id="app-root" class="phone-content"></div>
        <div class="home-indicator"></div>
      </div>
    </div>
    <div class="phone-label">Interactive prototype</div>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="AppShell.jsx"></script>

<script type="text/babel">
  ReactDOM.createRoot(document.getElementById("app-root")).render(<AppShell />);
</script>

</body>
</html>
