<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; }
  .card { padding: 20px 24px; font-family: var(--font-body); color: var(--text-primary); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .sw { flex: 1; min-width: 0; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 86px; border: 1px solid var(--border-subtle); }
  .sw .name { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-primary); }
  .sw .hex { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 10px; }
</style></head>
<body><div class="card">
  <div class="label">Surfaces — Dark</div>
  <div class="row">
    <div class="sw" style="background:#0A0A0E"><div class="name" style="color:#ECEAE4">bg-base</div><div class="hex">#0A0A0E</div></div>
    <div class="sw" style="background:#141418"><div class="name" style="color:#ECEAE4">bg-surface</div><div class="hex">#141418</div></div>
    <div class="sw" style="background:#1E1E26"><div class="name" style="color:#ECEAE4">bg-elevated</div><div class="hex">#1E1E26</div></div>
    <div class="sw" style="background:rgba(15,15,19,0.85); backdrop-filter: blur(8px); border:1px solid #242330"><div class="name" style="color:#ECEAE4">bg-overlay</div><div class="hex">rgba(15,15,19,.85)</div></div>
  </div>
</div></body></html>
