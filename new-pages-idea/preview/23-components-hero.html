<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 22px 24px; position: relative; overflow: hidden; min-height: 190px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: #C4AA7E; margin-bottom: 14px; position:relative; z-index:1;}
  .glow { position: absolute; top: -60px; left: 50%; transform: translateX(-50%); width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, #C4AA7E 0%, transparent 70%); opacity: 0.1; pointer-events:none; z-index:0;}
  h1 { font-family: var(--font-display); font-size: 34px; font-weight: 700; color:#ECEAE4; line-height:1.2; letter-spacing:-0.03em; margin-top: 8px; position: relative; z-index: 1;}
  .sub { font-size: 14px; color:#44424F; position: relative; z-index: 1;}
  hr { border: none; border-top: 1px solid rgba(196,170,126,0.10); margin-top: 16px; position:relative; z-index:1; }
  .star { opacity: 0.3; position:relative; z-index: 1;}
</style></head>
<body><div class="card">
  <div class="glow"></div>
  <div class="label">Hero — Song title · radial gold glow · 4-point star</div>
  <svg class="star" width="14" height="14" viewBox="0 0 16 16"><path d="M8 0 L9.5 6.5 L16 8 L9.5 9.5 L8 16 L6.5 9.5 L0 8 L6.5 6.5 Z" stroke="#C4AA7E" stroke-width="1" fill="none"/></svg>
  <h1>Chamka Sitara</h1>
  <div class="sub">Br. Ankur Masih &amp; Ps. Bharat · ICM</div>
  <hr>
</div></body></html>
