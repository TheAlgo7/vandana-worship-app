<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0;
    font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 22px 24px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.18em; color: var(--accent); margin-bottom: 14px; }
  .pills {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .pill {
    padding: 7px 14px; border-radius: 999px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    font-size: 12px; color: var(--text-secondary);
    cursor: pointer; transition: all 200ms ease;
    font-family: inherit;
  }
  .pill:hover { border-color: var(--accent); color: var(--text-primary); }
  .pill.active {
    background: var(--accent);
    color: var(--bg-base);
    border-color: var(--accent);
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(196,170,126,0.25);
  }
  .sub { font-size: 11px; color: var(--text-muted);
    margin-top: 14px; font-family: ui-monospace, monospace; }
</style></head>
<body><div class="card">
  <div class="label">Ministry chips — /ministry/[slug]</div>
  <div class="pills">
    <button class="pill active">ICM</button>
    <button class="pill">Nations of Worship</button>
    <button class="pill">Ankit Sajwan</button>
    <button class="pill">Yeshua Band</button>
    <button class="pill">Sheldon Bangera</button>
    <button class="pill">Anil Kant</button>
    <button class="pill">Bridge Music</button>
    <button class="pill">Filadelfia Music</button>
    <button class="pill">Jaago Music</button>
    <button class="pill">Amit Kamble</button>
    <button class="pill">Ernest Mall</button>
    <button class="pill">Yeshua Ministries</button>
  </div>
  <p class="sub">12 ministries indexed · SEO-friendly server-rendered pages at /ministry/[slug]</p>
</div></body></html>
