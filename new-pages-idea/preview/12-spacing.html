<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 22px 24px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
  .bar { background: #C4AA7E; opacity: 0.6; height: 10px; border-radius: 2px; }
  .n { font-family: ui-monospace, monospace; font-size:10px; color:#87849A; }
  .l { font-size: 12px; color:#ECEAE4; width: 44px; }
</style></head>
<body><div class="card">
  <div class="label">Spacing — 4px base · 20px horizontal padding</div>
  <div class="row"><span class="l">4</span><div class="bar" style="width:4px"></div><span class="n">micro gap — icon:text</span></div>
  <div class="row"><span class="l">8</span><div class="bar" style="width:8px"></div><span class="n">chip:chip</span></div>
  <div class="row"><span class="l">12</span><div class="bar" style="width:12px"></div><span class="n">card padding</span></div>
  <div class="row"><span class="l">16</span><div class="bar" style="width:16px"></div><span class="n">section gap</span></div>
  <div class="row"><span class="l">20</span><div class="bar" style="width:20px"></div><span class="n">horizontal page padding</span></div>
  <div class="row"><span class="l">24</span><div class="bar" style="width:24px"></div><span class="n">vertical section</span></div>
  <div class="row"><span class="l">36</span><div class="bar" style="width:36px"></div><span class="n">large section</span></div>
</div></body></html>
