<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 22px 24px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 14px; }
  .row { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  .sp { display: flex; align-items: baseline; gap: 10px; }
  .sp .name { font-size: 10px; color: #87849A; font-family: ui-monospace, monospace; }
</style></head>
<body><div class="card">
  <div class="label">Display Type — Lora</div>
  <div class="row">
    <div class="sp"><span style="font-family:var(--font-display); font-size:48px; font-weight:700; letter-spacing:-0.03em; line-height:1">Vandana</span><span class="name">48 / 700</span></div>
  </div>
  <div class="row" style="margin-top: 14px;">
    <div class="sp"><span style="font-family:var(--font-display); font-size:34px; font-weight:700; letter-spacing:-0.03em;">Chamka Sitara</span><span class="name">34 · h1</span></div>
  </div>
  <div class="row" style="margin-top: 10px;">
    <div class="sp"><span style="font-family:var(--font-display); font-size:22px; font-weight:600;">Worship set builder</span><span class="name">22 · h3</span></div>
  </div>
</div></body></html>
