<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; }
  .card { padding: 20px 24px; font-family: var(--font-body); color: var(--text-primary); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sw { border-radius: 10px; padding: 14px 12px; min-height: 88px; display:flex; flex-direction: column; gap: 6px; background:#141418; border:1px solid #1C1B26; }
  .swatch-chip { width: 44px; height: 20px; border-radius: 4px; }
  .name { font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
  .hex { font-family: ui-monospace, monospace; font-size: 10px; color: #87849A; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 10px; }
</style></head>
<body><div class="card">
  <div class="label">Text Colors — Dark</div>
  <div class="row">
    <div class="sw"><div class="swatch-chip" style="background:#ECEAE4"></div><div class="name" style="color:#ECEAE4">text-primary</div><div class="hex">#ECEAE4 · fg1</div></div>
    <div class="sw"><div class="swatch-chip" style="background:#87849A"></div><div class="name" style="color:#87849A">text-secondary</div><div class="hex">#87849A · fg2</div></div>
    <div class="sw"><div class="swatch-chip" style="background:#44424F"></div><div class="name" style="color:#44424F">text-muted</div><div class="hex">#44424F · fg3</div></div>
  </div>
</div></body></html>
