<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0; font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 22px 24px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 14px; }
  .row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px; }
  .name { font-size: 10px; color: #87849A; font-family: ui-monospace, monospace; }
</style></head>
<body><div class="card">
  <div class="label">Devanagari — Noto Sans Devanagari</div>
  <div class="row"><span style="font-family:var(--font-devanagari); font-size:28px; font-weight:500; line-height:2.15;">वंदना</span><span class="name">28 · Title</span></div>
  <div class="row"><span style="font-family:var(--font-devanagari); font-size:18px; line-height:2.15;">तेरी वंदना गाएँ शामों सवेरे</span><span class="name">18 · lyrics</span></div>
  <div class="row"><span style="font-family:var(--font-devanagari); font-size:13px; color:#87849A;">दिन का वचन — यूहन्ना 3:16</span><span class="name">13 · ref</span></div>
</div></body></html>
