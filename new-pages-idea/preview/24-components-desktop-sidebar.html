<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #0A0A0E; margin: 0; padding: 0;
    font-family: var(--font-body); color: var(--text-primary); }
  .card { padding: 22px 24px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.18em; color: var(--accent); margin-bottom: 16px; }
  .sub { font-size: 10px; color: #87849A; font-family: ui-monospace, monospace; margin-top: 8px; }

  /* Sidebar mock */
  .sidebar {
    width: 220px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 12px 20px;
    display: flex; flex-direction: column; gap: 4px;
    height: 360px; box-sizing: border-box;
  }
  .logo {
    padding: 0 8px 24px;
  }
  .word {
    font-family: var(--font-brand);
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .line {
    width: 28px; height: 1px;
    background: var(--accent); opacity: 0.4;
    margin-top: 6px;
  }
  .tag {
    font-size: 10px; color: var(--text-muted);
    margin-top: 6px;
    font-style: italic;
  }

  .nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }

  .item {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    height: 38px; padding: 0 12px;
    border-radius: 999px;
    font-size: 13px; font-weight: 500;
    color: #858294;
    text-decoration: none;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: color 200ms ease, background 200ms ease;
  }
  .item:hover { background: var(--bg-elevated); color: var(--text-primary); }
  .item.active {
    background: linear-gradient(180deg, #D4BC94 0%, #B89B70 100%);
    color: #0A0A0E;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.20),
      inset 0 -1px 0 rgba(0,0,0,0.10);
  }
  .item svg { width: 16px; height: 16px; }
  .item .dot {
    margin-left: auto;
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
  }

  .footer {
    padding: 16px 8px 0;
    border-top: 1px solid var(--border-subtle);
  }
  .ab {
    display: block; font-size: 10px; color: var(--text-muted);
    text-decoration: none; margin-bottom: 6px;
  }
  .ver {
    font-size: 10px; color: var(--text-muted); letter-spacing: 0.06em;
  }
</style></head>
<body><div class="card">
  <div class="label">Desktop Sidebar — ≥900px</div>

  <div class="sidebar">
    <div class="logo">
      <div class="word">Vandana</div>
      <div class="line"></div>
      <div class="tag">Worship in your language</div>
    </div>

    <nav class="nav">
      <a class="item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>Home</span>
      </a>
      <a class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span>Updates</span>
        <span class="dot"></span>
      </a>
      <a class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></svg>
        <span>Setlist</span>
      </a>
      <a class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.3 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.7 0-3 .5-4.5 2-1.5-1.5-2.8-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.2 1.5 4 3 5.5l7 7Z"/></svg>
        <span>Favourites</span>
      </a>
      <a class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33"/></svg>
        <span>Settings</span>
      </a>
    </nav>

    <div class="footer">
      <a class="ab">About</a>
      <div class="ver">v2.5.0 Public Beta</div>
    </div>
  </div>
</div></body></html>
