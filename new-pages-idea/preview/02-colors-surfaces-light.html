<!doctype html>
<html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { background: #F4F0E8; margin: 0; padding: 0; }
  .card { padding: 20px 24px; font-family: var(--font-body); color: var(--text-primary); }
  .row { display: flex; gap: 10px; align-items: stretch; }
  .sw { flex: 1; min-width: 0; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 86px; border: 1px solid #E0DACE; }
  .sw .name { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: #18151E; }
  .sw .hex { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10px; color: #A8A4B0; margin-top: 2px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: #7A6340; margin-bottom: 10px; }
</style></head>
<body><div class="card">
  <div class="label">Surfaces — Light (parchment)</div>
  <div class="row">
    <div class="sw" style="background:#F4F0E8"><div class="name">bg-base</div><div class="hex">#F4F0E8</div></div>
    <div class="sw" style="background:#FEFCF8"><div class="name">bg-surface</div><div class="hex">#FEFCF8</div></div>
    <div class="sw" style="background:#EDE8DD"><div class="name">bg-elevated</div><div class="hex">#EDE8DD</div></div>
    <div class="sw" style="background:rgba(244,240,232,0.90)"><div class="name">bg-overlay</div><div class="hex">rgba(244,240,232,.90)</div></div>
  </div>
</div></body></html>
