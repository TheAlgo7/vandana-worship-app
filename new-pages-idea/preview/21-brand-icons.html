<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>

  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .ic { display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px; }
  .ic svg { width: 22px; height: 22px; color: #ECEAE4; }
  .ic span { font-size: 10px; color: #87849A; font-family: ui-monospace, monospace; }
</style></head>
